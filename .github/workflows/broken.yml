name: site-check
on: push
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: clone
        uses: actions/checkout@v4
      - name: Read the readme
        run: cat README.md
      - name: setuppython
        uses: actions/setup-python@v5
      - name: Show the Python version
        run: pyhton3 --version
