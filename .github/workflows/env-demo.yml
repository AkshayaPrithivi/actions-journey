name: env-demo
on:
  push:
    paths:
      - '.github/workflows/env-demo.yml'
env:
  APP_NAME: Journey
jobs:
  env-demo:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: info
    steps:
      - name: print env-demo at diff level
        env:        
          LOG_LEVEL: debug
        run: echo $APP_NAME with the log level $LOG_LEVEL



