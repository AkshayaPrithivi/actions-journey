name: secret-check
on:
  push:
    paths:
      - '.github/workflows/secret-check.yml'
jobs:
  secret:
    runs-on: ubuntu-latest
    steps:
      - name: check secret
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          if [ -n "$APP_TOKEN" ]; then
            echo "present" 
          else
            echo "no"
            exit 1
          fi
              
