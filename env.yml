name: environment
on:
  push:
    paths:
      - '.github/workflows/env.yml'
env:
  APP_NAME: Journey
jobs:
  environment:
    runs-on: ubuntu-latest
    env:
      LOG_LEVEL: info
    steps:
      - name: print env at diff level
        env:        
          LOG_LEVEL: debug
        run: echo $APP_NAME with the log level $LOG_LEVEL



